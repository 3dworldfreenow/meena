{% extends 'base.html' %}
{% block title %}खोज — Search{% endblock %}
{% block body %}
<h1>खोज <small>· Search both books</small></h1>
<form class="filter" id="searchform" action="{{ url_for('search') }}">
  <input name="q" id="searchq" placeholder="गोत्र या कोई शब्द / a gotra or any word: Chauhan, आमेर, खोह" autofocus>
  <button class="btn">खोजें</button>
</form>
<div class="grid g2" style="margin-top:16px" id="results" hidden>
  <div class="card">
    <h2>गोत्र <small id="gcount"></small></h2>
    <ul class="gotras" id="gres"></ul>
    <p class="muted" id="gnone" hidden>कोई गोत्र नहीं मिला।</p>
  </div>
  <div class="card">
    <h2>मीणा-इतिहास में <small id="hcount"></small></h2>
    <p class="muted" id="hmsg"></p>
    <ul class="hits" id="hres"></ul>
  </div>
</div>
{% endblock %}
